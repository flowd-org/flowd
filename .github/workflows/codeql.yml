name: codeql

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@821474463d541e9c67e7c310e6b95c7c6a44e327
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@821474463d541e9c67e7c310e6b95c7c6a44e327

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@821474463d541e9c67e7c310e6b95c7c6a44e327