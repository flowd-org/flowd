name: conformance

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    env:
      FLWD_TOKEN: ${{ secrets.FLWD_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build flwd binary
        run: go build -o ./bin/flwd ./

      - name: Verify bash
        run: bash --version

      - name: Verify PowerShell
        run: pwsh -v

      - name: Run root tests
        run: go test ./...

      - name: Run conformance module tests
        working-directory: conformance
        run: go test ./...

      - name: Check conformance token availability
        if: ${{ env.FLWD_TOKEN == '' }}
        run: echo "FLWD_TOKEN not available (likely fork PR); skipping conformance harness"

      - name: Run conformance harness
        working-directory: conformance
        if: ${{ env.FLWD_TOKEN != '' }}
        run: go run ./cmd/conformance --flwd-binary ../bin/flwd --report-json ../conformance-report.json

      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: conformance-report.json
          retention-days: 7
          if-no-files-found: warn
