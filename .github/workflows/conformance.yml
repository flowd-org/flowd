name: conformance

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    env:
      FLWD_TOKEN: ${{ secrets.FLWD_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build flwd binary
        run: go build -o ./bin/flwd ./

      - name: Verify bash
        run: bash --version

      - name: Verify PowerShell
        run: pwsh -v

      - name: Run root tests
        run: go test ./...

      - name: Run conformance module tests
        working-directory: conformance
        run: go test ./...

      - name: Fail when token missing on trusted paths (push)
        if: ${{ env.FLWD_TOKEN == '' && github.event_name == 'push' }}
        run: |
          echo "FLWD_TOKEN missing on trusted path (push); conformance harness cannot run" >&2
          exit 1

      - name: Check if internal PR with missing token
        id: check_internal_pr
        if: ${{ env.FLWD_TOKEN == '' && github.event_name == 'pull_request' }}
        run: |
          is_fork="${{ github.event.pull_request.head.repo.fork }}"
          if [[ "$is_fork" == "false" ]]; then
            echo "is_internal_pr_with_missing_token=true" >> $GITHUB_OUTPUT
          else
            echo "is_internal_pr_with_missing_token=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail when token missing on internal PR
        if: ${{ steps.check_internal_pr.outputs.is_internal_pr_with_missing_token == 'true' }}
        run: |
          echo "FLWD_TOKEN missing on trusted path (internal PR); conformance harness cannot run" >&2
          exit 1

      - name: Check if fork PR with missing token
        id: check_fork
        run: |
          is_fork="${{ github.event.pull_request.head.repo.fork }}"
          if [[ "$is_fork" == "true" && "${{ env.FLWD_TOKEN }}" == "" ]]; then
            echo "is_fork_pr_with_missing_token=true" >> $GITHUB_OUTPUT
          else
            echo "is_fork_pr_with_missing_token=false" >> $GITHUB_OUTPUT
          fi

      - name: Warn when token missing on fork PR
        if: ${{ steps.check_fork.outputs.is_fork_pr_with_missing_token == 'true' }}
        run: |
          echo "Fork PR without token: conformance harness not executed"

      - name: Build conformance harness binary
        working-directory: conformance
        run: go build -o ../bin/conformance ./cmd/conformance

      - name: Run conformance harness
        if: ${{ env.FLWD_TOKEN != '' }}
        run: ./bin/conformance --flwd-binary ./bin/flwd --report-json ./conformance-report.json

      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: conformance-report.json
          retention-days: 7
          if-no-files-found: warn
