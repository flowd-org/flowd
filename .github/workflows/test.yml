name: test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: Run root tests
        run: go test ./...

      - name: Run conformance module tests
        run: |
          if [ -f conformance/go.mod ]; then
            cd conformance
            go test ./...
          else
            echo "conformance module not present; skipping"
          fi

  coverage:
    name: coverage
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: Run tests with race detector and coverage
        run: |
          go test -race -coverprofile=coverage.txt ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: coverage.txt
          retention-days: 7

      - name: Check coverage threshold
        run: |
          total_coverage=$(go tool cover -func=coverage.txt | grep -E '^\s*total:' | grep -oP '\d+\.\d+')
          echo "Overall Coverage: ${total_coverage}%"

          go tool cover -func=coverage.txt | \
            awk '
              BEGIN {
                overall_stmts = 0
                overall_covered = 0
                failures = ""
              }

              /^total:/ { next }
              /^[[:space:]]*$/ { next }

              /:[0-9]+:[a-zA-Z_][a-zA-Z0-9_]*[[:space:]]+[0-9]+[[:space:]]+[0-9]+[[:space:]]+[0-9]+\.[0-9]+%$/ {
                match($0, /^[^:]+/)
                filepath = substr($0, 1, RLENGTH)

                if (filepath ~ /mock_|_generated|\.pb\.go|\.gen\.go/) next

                n = split($0, fields, /[[:space:]]+/)
                if (n >= 4) {
                  stmts = fields[n-3] + 0
                  total_stmts = fields[n-2] + 0
                  coverage = fields[n-1] + 0

                  if (stmts == 0 || total_stmts == 0) next

                  pkg = extract_pkg(filepath)
                  if (pkg != "") {
                    pkg_stmts[pkg] += stmts
                    pkg_covered[pkg] += stmts * coverage / 100
                  }
                }
              }

              function extract_pkg(path) {
                n = split(path, parts, "/")

                for (i=1; i<=n; i++) {
                  if (parts[i] == "internal" || parts[i] == "pkg") {
                    if (i+1 <= n && parts[i+1] != "") return parts[i+1]
                  }
                }

                for (i=1; i<=n; i++) {
                  if (parts[i] != "" && parts[i] != "." && parts[i] != "..") {
                    return parts[i]
                  }
                }

                return ""
              }

              END {
                n = asorti(pkg_stmts, sorted_pkgs)

                for (i=1; i<=n; i++) {
                  pkg = sorted_pkgs[i]
                  stmts = pkg_stmts[pkg]
                  covered = pkg_covered[pkg]
                  cov_pct = (stmts > 0) ? (covered / stmts * 100) : 0

                  overall_stmts += stmts
                  overall_covered += covered

                  if (cov_pct < 85) {
                    failures = failures pkg ": " sprintf("%.1f", cov_pct) "%\n"
                  }
                }

                overall_cov = (overall_stmts > 0) ? (overall_covered / overall_stmts * 100) : 0
                exit_code = 0

                if (overall_cov < 85) {
                  print "::error::Overall coverage " sprintf("%.1f", overall_cov) "% is below threshold of 85%"
                  exit_code = 1
                }

                if (failures != "") {
                  print "::error::Packages below 85% coverage threshold:"
                  printf "%s", failures
                  exit_code = 1
                }

                if (exit_code == 0) {
                  print "Overall Coverage: " sprintf("%.1f", overall_cov) "% meets threshold of 85%"
                }

                exit exit_code
              }
            '